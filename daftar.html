<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar · Cuanis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<header class="site-header">
  <div class="topbar">
    <nav class="nav eyebrow" aria-label="Menu utama">
      <a href="index.html">Beranda</a>
      <a href="masuk.html">Masuk</a>
    </nav>
    <a class="logo" href="index.html">cuanis</a>
    <span class="avatar-user" aria-label="Akun Sari">S</span>
  </div>
</header>

<main class="container" style="align-items: center; justify-content: center; min-height: calc(100vh - 160px);">
  <div style="width: 100%; max-width: 480px;">
    <div style="margin-bottom: 20px; text-align: center;">
      <div class="eyebrow">Mulai atur keuangan</div>
      <h1 style="margin-top: 6px;">Buat Akun Baru</h1>
    </div>

    <form class="card card-lavender form-card" style="max-width: 100%;" action="dashboard.html" method="post">
      <div class="form-grid">
        <div class="full">
          <label class="label" for="nama">Nama Lengkap</label>
          <input class="input" id="nama" name="nama" placeholder="Contoh: Sari Nafisah" required>
        </div>
        <div class="full">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" placeholder="sari@example.com" required>
        </div>
        <div class="full">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password"
           type="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-actions" style="margin-top: 28px; justify-content: space-between; align-items: center;">
        <span style="font-size: 13px; color: var(--muted);">Sudah punya akun? <a href="masuk.html" style="font-weight: 700; color: var(--maroon); text-decoration: underline;">Masuk</a></span>
        <button class="btn" type="submit">Daftar Akun</button>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer" style="text-align: center;">
  © 2026 Cuanis · Dompet manis untuk uang yang rapi
</footer>
</body>
</html>
